<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas y Gestión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Consultas y Gestión</h1>
    <div class="user-nav-bar">
        <button onclick="location.href='index.html'" class="btn-home-nav" title="Volver al Menú">
            <i class="fa-solid fa-house"></i>
        </button>
        <p id="headerUserDisplay" style="text-align: center; color: #007bff; font-weight: bold; font-size: 0.9rem; margin: 0;"></p>
    </div>
    
    <!-- Botón para volver -->
    <div class="header-actions">
        <button id="btnViewTotal" class="btn-nav"><i class="fa-solid fa-calculator"></i>Solo Total</button>
        <button id="btnViewDetail" class="btn-nav"><i class="fa-solid fa-list-ul"></i>Detalle</button>
        <button id="btnViewAccounts" class="btn-nav"><i class="fa-solid fa-building-columns"></i>Cuentas</button>
        <button id="btnViewEvolution" class="btn-nav"><i class="fa-solid fa-chart-line"></i>Evolución</button>
        <button id="btnViewByCategory" class="btn-nav"><i class="fa-solid fa-tags"></i>Categorías</button>
        <button id="btnViewByConcept" class="btn-nav"><i class="fa-solid fa-layer-group"></i>Conceptos</button>
        <button id="btnPayAllToday" class="btn-nav"><i class="fa-solid fa-check-double"></i>Pagar todo hoy</button>
        <button id="btnExportPDF" class="btn-nav"><i class="fa-solid fa-file-pdf"></i>Exportar PDF</button>
    </div>

    <div class="card-container" style="flex-direction: column; align-items: center;">
        <!-- Filtros -->
        <div class="card filter-card">
            <h2 style="margin-bottom: 20px;">Filtros de Búsqueda</h2>
            <div class="filters-container">
                <div class="filter-group">
                    <label>Zona</label>
                    <select id="filterLevel0">
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Banco</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <select id="filterBank" style="flex: 1; min-width: 0; width: auto;">
                            <option value="">Cargando...</option>
                        </select>
                        <span id="bankBalanceDisplay" title="Saldo actual del banco (Ingresos - Gastos históricos)"
                              style="display: none; font-size: 0.82rem; font-weight: bold; white-space: nowrap;
                                     padding: 4px 7px; border-radius: 5px; border: 1px solid #ddd;
                                     background: #f8f9fa; min-width: 78px; text-align: center;"></span>
                    </div>
                </div>
                <div class="filter-group">
                    <label>Comercio</label>
                    <select id="filterMerchant">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Concepto</label>
                    <select id="filterProduct">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Categoría</label>
                    <select id="filterCategory">
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Desde</label>
                    <input type="date" id="filterDateStart">
                </div>
                <div class="filter-group">
                    <label>Hasta</label>
                    <input type="date" id="filterDateEnd">
                </div>

                <!-- Nuevo filtro para Fecha de Gasto vs Fecha de Pago -->
                <div class="filter-group">
                    <label>Filtrar fechas por:</label>
                    <div style="display: flex; align-items: center; gap: 8px; height: 38px;">
                        <input type="radio" id="filterByIncurredDate" name="dateFilterType" value="incurredDate" checked style="width: auto; min-width: auto; margin: 0; cursor: pointer;">
                        <label for="filterByIncurredDate" style="margin: 0 12px 0 0; font-weight: normal; cursor: pointer; white-space: nowrap;">Fecha Gasto</label>
                        <input type="radio" id="filterByPaymentDate" name="dateFilterType" value="paymentDate" style="width: auto; min-width: auto; margin: 0; cursor: pointer;">
                        <label for="filterByPaymentDate" style="margin: 0; font-weight: normal; cursor: pointer; white-space: nowrap;">Fecha Pago</label>
                    </div>
                </div>
                <div class="filter-actions" style="grid-column: span 2;">
                    <button id="btnPrevMonth" class="btn-nav"><i class="fa-solid fa-angle-left"></i>Mes Ant.</button>
                    <button id="btnCurrMonth" class="btn-nav"><i class="fa-solid fa-calendar-day"></i>Mes Act.</button>
                    <button id="btnCurrYear" class="btn-nav"><i class="fa-solid fa-calendar-days"></i>Año Act.</button>
                </div>
                <div class="filter-group" style="flex-direction: row; align-items: center; height: 38px;">
                    <input type="checkbox" id="filterReturns" style="width: 18px; height: 18px; margin-right: 8px; cursor: pointer;">
                    <label for="filterReturns" style="margin: 0; cursor: pointer; font-weight: bold; color: #dc3545;">Ver Devoluciones</label>
                </div>
                <div class="filter-actions">
                    <button id="searchBtn" class="btn-nav" style="flex: 1;">
                        <i class="fa-solid fa-magnifying-glass"></i>Buscar
                    </button>
                    <button id="clearFiltersBtn" class="btn-nav" style="flex: 1;">
                        <i class="fa-solid fa-broom"></i>Limpiar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabla Resultados -->
        <div class="table-container" style="margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Resultados</h3>
                <div>
                    <span id="totalIncomes" style="font-weight: bold; font-size: 1.2rem; color: #28a745; margin-right: 15px; cursor: pointer;" title="Ver detalle de Ingresos">Ingresos: 0.00 €</span>
                    <span id="totalResults" style="font-weight: bold; font-size: 1.2rem; color: #007bff; margin-right: 15px;">Gastos: 0.00 €</span>
                    <span id="totalBalance" style="font-weight: bold; font-size: 1.2rem; color: #333;">Balance: 0.00 €</span>
                </div>
            </div>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Zona</th>
                        <th>Banco</th>
                        <th>Comercio</th>
                        <th>Concepto</th>
                        <th>Categoría</th>
                        <th>Importe</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Se rellena con JS -->
                </tbody>
                <tfoot>
                    <!-- Se rellena con JS (Total Global) -->
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Resumen Estadístico -->
    <div class="card-container" style="margin-top: 20px; justify-content: center; gap: 20px;">
        <div class="card stat-card">
            <h3 style="margin: 0; font-size: 1rem; color: #555;">Gasto Máximo</h3>
            <p id="statMax" style="font-size: 1.5rem; font-weight: bold; color: #dc3545; margin: 10px 0 0;">0.00 €</p>
        </div>
        <div class="card stat-card">
            <h3 style="margin: 0; font-size: 1rem; color: #555;">Gasto Medio</h3>
            <p id="statAvg" style="font-size: 1.5rem; font-weight: bold; color: #ffc107; margin: 10px 0 0;">0.00 €</p>
        </div>
        <div class="card stat-card">
            <h3 style="margin: 0; font-size: 1rem; color: #555;">Nº Tickets</h3>
            <p id="statCount" style="font-size: 1.5rem; font-weight: bold; color: #17a2b8; margin: 10px 0 0;">0</p>
        </div>
    </div>

    <!-- Gráfico de Gastos -->
    <div class="card-container" style="margin-top: 20px; margin-bottom: 40px; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 1000px; cursor: default; transform: none; padding: 20px; height: 500px;">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <!-- Modal Edición -->
    <div id="editModalOverlay" class="modal-overlay">
        <div class="modal-content">
            <h2 id="editModalTitle">Editar Gasto</h2>
            <input type="hidden" id="editId"> <!-- ID oculto de Firestore -->
            <div class="form-group">
                <label>Zona</label>
                <select id="editLevel0">
                    <option>Cargando...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Comercio</label>
                <input type="text" id="editMerchant">
            </div>
            <div class="form-group">
                <label>Banco</label>
                <input type="text" id="editBank">
            </div>
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="editDate">
            </div>
            <div class="form-group">
                <label>Fecha Pago (Opcional)</label>
                <input type="date" id="editPaymentDate">
            </div>
            <div class="form-group">
                <label>Concepto</label>
                <input type="text" id="editProduct">
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="editCategory">
                    <option>Cargando...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Importe (€)</label>
                <input type="number" id="editAmount" step="0.01">
            </div>
            <div class="modal-actions">
                <button id="saveEditBtn" class="btn-save">Guardar Cambios</button>
                <button id="closeEditBtn" class="btn-close">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Librerías para exportar a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="js/consultas.js"></script>
</body>
</html>
